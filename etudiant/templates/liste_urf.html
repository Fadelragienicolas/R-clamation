
{% extends "base.html" %}


{% block title %} Liste UFR {% endblock title %}


{% block content %}
<!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h1 mb-2 text-gray-800">{{page}}</h1>
                    <p class="mb-4">{{description}}<a target="_blank">


                        <!-- Earnings (Monthly) Card Example -->
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-primary shadow h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                           <a href="{% url 'ajout_ufr' %}" class="btn btn-primary">{{bouton}}</a>                                         
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-plus fa-2x text-gray-300"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
       
                
                    <!-- DataTales Classe -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <div class="row">
                                <div class="col-lg-6">
                                    <h5 class=" mt-2 font-weight-bold text-primary">liste des UFR</h5>
                                    
                                </div>
                                <div class="col-lg-6">
                                <div class="d-sm-flex align-items-center justify-content-between">
                                
                                <h1 class="h3 mb-0 text-gray-800"></h1>

                                <!-- <div>
                                    <a href="?{{ request.GET.urlencode }}" 
                                    class="d-none d-sm-inline-block btn btn-sm btn-danger shadow-sm">
                                        <i class="fas fa-file-pdf fa-sm text-white-50"></i> Télécharger PDF
                                    </a>

                                    <a href="?{{ request.GET.urlencode }}" 
                                    class="d-none d-sm-inline-block btn btn-sm btn-success shadow-sm">
                                        <i class="fas fa-file-excel fa-sm text-white-50"></i> Télécharger Excel
                                    </a>
                                </div> -->

                            </div> </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0"  style="font-size: 14px;">
                                    <thead>
                                        <tr>
                                            <th>UFR</th>
                                            <th>Description</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    
                                    {% for ufr in liste_ufr %} 
                                                                          
                                    <tbody>
                                        <tr>
                                            <td>{{ufr.nom}}</td>
                                            <td>{{ufr.description}}</td>
                                            <td>
                                                <a href="{% url 'modifier_ufr' ufr.id %}" class="btn btn-warning btn-sm" title="Modifier">
                                                    <i class="fas fa-edit"></i>
                                                </a>

                                                <a href="{% url 'supprimer_ufr' ufr.id %}" class="btn btn-danger btn-sm" title="Supprimer">
                                                    <i class="fas fa-trash"></i>
                                                </a>

                                                <a href="" class="btn btn-info btn-sm" title="Voir les informations">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>

                                     {% endfor %}

                                </table>
                            </div>
                        </div>
                    </div>
                </div>


                    
{% endblock content %}
